# yaml-language-server: $schema=http://localhost:8000/api/v1alpha/schema
api_version: v1alpha
artifacts:
  - name: python-package
    dockerfile: Dockerfile
    dockerfile_stage: python-wheel
    type:
      python_wheel:
        folder_path: path
# Test artifact
  - name: api
    dockerfile_stage: api-server
    execution:
      local_resources:
        min_cpu_cores: 0.1
        min_memory_mb: 128
    type:
      docker_image: {}
project: nautilus
version: 0.0.1
