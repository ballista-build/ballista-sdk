[project]
name = "ballista"
version = "0.1.0"
description = "Ballista SDK"
readme = "README.md"
authors = [
    { name = "August Bigelow", email = "dev@atbigelow.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cattrs>=24.1.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
cli = [
    "typer>=0.15.1"
]

[project.scripts]
ballista = "ballista:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]
generation = [
    {include-group = "dev"},
    "openapi-generator-cli[jdk4py]>=7.11.0.post0",
]