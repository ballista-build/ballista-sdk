[project]
name = "ballista-sdk"
version = "0.1.0"
description = "Ballista.build SDK for Python"
readme = "README.md"
authors = [{ name = "August Bigelow", email = "dev@atbigelow.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "kubernetes>=32.0",
    "openapi-pydantic>=0.5.1",
    "pydantic>=2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "semver>=3.0",
    "ty>=0.0.1a32",
    "urllib3>=1.25,<3.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=9.0",
    "coverage>=7.7",
    "ty>=0.0.1a21",
    "kubernetes-typed[client]>=18.20.2",
    "pyrefly>=0.54.0",
    "fastapi",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["src"]

[tool.pytest]
asyncio_mode = "auto"
markers = [
    "unit: Tests with no other dependent systems",
    "integration: Tests requiring dependent systems"
]

[tool.ruff]
line-length = 120
target-version = "py312"
