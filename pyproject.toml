[project]
name = "ballista-cli"
version = "0.1.0"
description = "Ballista Command Line Interface"
readme = "README.md"
authors = [
    { name = "August Bigelow", email = "dev@atbigelow.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cattrs>=24.1.2",
    "pyyaml>=6.0.2",
    "typer>=0.15.1",
]

[project.scripts]
ballista = "ballista_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26.4",
    "ruff>=0.9.0",
]
