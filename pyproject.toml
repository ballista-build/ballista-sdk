[project]
name = "ballista-sdk"
dynamic = ["version"]
description = "Ballista.build SDK for Python"
readme = "README.md"
authors = [{ name = "August Bigelow", email = "dev@atbigelow.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.5",
    "kubernetes>=36.0,<37.0",
    "openapi-pydantic>=0.5.1",
    "pydantic>=2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "semver>=3.0",
    "urllib3>=1.25,<3.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi"]
# kubernetes = ["kubernetes"]

[project.urls]
GitHub = "https://github.com/ballista-build/ballista-sdk"

[dependency-groups]
tests = ["pytest", "pytest-asyncio"]
coverage = [{ include-group = "tests" }, "coverage[toml]"]
dev = [
    { include-group = "coverage" },
    "ruff",
    "ty",
    "fastapi",
    "kubernetes-stubs-elephant-fork>=36.0,<37.0",
]

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.coverage.run]
source = ["src"]

[tool.pytest]
asyncio_mode = "auto"
markers = [
    "unit: Tests with no other dependent systems",
    "integration: Tests requiring dependent systems"
]

[tool.ruff]
line-length = 120
target-version = "py312"
