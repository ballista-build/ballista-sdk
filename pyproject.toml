[project]
name = "ballista-sdk"
version = "0.1.0"
description = "Ballista.build SDK"
readme = "README.md"
authors = [{ name = "August Bigelow", email = "dev@atbigelow.com" }]
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=32.0",
    "openapi-pydantic>=0.5.1",
    "pydantic>=2",
    "pyyaml>=6.0",
    "semver>=3.0",
    "urllib3>=1.25,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "coverage>=7.7",
    "pyrefly>=0.31",
    "prettytable",
]
